# ============================================================================
#  孤鱼GY · 天空之隙 —— Nginx 站点配置
#  目标路径：/etc/nginx/sites-available/sky-gap
#  启用：ln -s /etc/nginx/sites-available/sky-gap /etc/nginx/sites-enabled/sky-gap
#
#  与项目根目录的 web.config 功能等价，按服务器环境二选一：
#    IIS   → 项目根 web.config
#    Nginx → 本文件
#  两者保持同步：改动其中一份的缓存、安全头或屏蔽清单时，另一份必须同步。
# ============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 兼容回源携带的 Host、裸域直访与 IP 直访
    server_name www.080322.xyz 080322.xyz _;

    root /var/www/sky-gap;
    index index.html;

    charset utf-8;

    # 不回显 Nginx 版本号（对应 IIS 移除 Server 头的意图）
    server_tokens off;

    # ------------------------------------------------------------------
    # 压缩（对应 web.config 的 urlCompression）
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    # 图片、mp3、woff2 本身已压缩，不纳入 gzip，避免浪费 CPU

    # ------------------------------------------------------------------
    # 安全响应头（对应 web.config 的 customHeaders）
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP：按实际使用面收紧
    #   cdn.jsdelivr.net —— Twemoji 图标 CDN（仅安全上下文使用，见 index.html）
    #   v2.xxapi.cn      —— 星座运势 API
    #   www.google.com   —— 工具箱站点图标 s2 favicon 源；缺它时 /tools/ 图标会被静默拦截
    #   blob:            —— connect-src：Live2D 通过 Blob URL 加载本地 JSON；
    #                       media-src：本地音乐用 createObjectURL 生成音频地址，
    #                       缺它时音频被静默拦截，只触发 error 事件、不报跨域
    #   注意：不得添加 upgrade-insecure-requests —— 源站服务在 HTTP 上，加了会导致子资源全部加载失败
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net https://www.google.com; font-src 'self'; media-src 'self' blob:; connect-src 'self' blob: https://v2.xxapi.cn; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # HSTS：浏览器只在 HTTPS 响应中采纳。以 Flexible 模式回源（HTTP）时
    # 该头到不了浏览器；将来若切到 Full / Full Strict 回源会自动生效，无需改动。
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ------------------------------------------------------------------
    # 屏蔽内部路径（对应 web.config 的 requestFiltering/hiddenSegments）
    # 纵深防御：这些内容打包时已排除，此处再拦一层，防止日后误传
    # ------------------------------------------------------------------
    # 所有点开头的隐藏文件与目录（.git、.gitignore 一并覆盖）
    location ~ /\. {
        return 403;
    }

    # 构建产物目录
    location ~ ^/release(/|$) {
        return 403;
    }

    # 部署配置目录
    location ~ ^/deploy(/|$) {
        return 403;
    }

    # 服务器运维资料（含真实服务器地址与端口）
    location ~ ^/服务器运维(/|$) {
        return 403;
    }

    # 内部文档、生成脚本与 IIS 配置文件
    location ~* ^/(memory\.md|memory-tools\.md|README\.md|generate_playlist\.py|web\.config)$ {
        return 403;
    }

    # ------------------------------------------------------------------
    # 缓存策略（对应 web.config 的 clientCache 分级）
    #
    # 用 expires 而非 add_header 设置缓存：location 里一旦出现 add_header，
    # 会覆盖 server 级继承的全部 add_header（含上面的 CSP），expires 无此副作用。
    #
    # 前缀匹配按「最长前缀优先」，与书写顺序无关。
    # ------------------------------------------------------------------

    # HTML 不缓存，保证访客每次拿到最新入口
    location ~* \.html$ {
        expires -1;
    }

    # 音乐：30 天（最长前缀，自动优先于 /assets/）
    location ^~ /assets/music/ {
        expires 30d;
    }

    # 静态资源（字体、图标等）：7 天
    location ^~ /assets/ {
        expires 7d;
    }

    # CSS / JS：1 天
    location ^~ /css/ {
        expires 1d;
    }

    location ^~ /js/ {
        expires 1d;
    }

    # Live2D：7 天
    # .moc / .mtn 是 Live2D 专有格式（原由 live2d/web.config 注册 MIME）。
    # Ubuntu 的 nginx.conf 默认 default_type 已是 application/octet-stream，
    # 此处显式声明以求自文档化，不依赖系统默认值。
    location ^~ /live2d/ {
        expires 7d;

        location ~* \.(moc|mtn)$ {
            default_type application/octet-stream;
            expires 7d;
        }
    }

    # ------------------------------------------------------------------
    # 兜底
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # 禁止目录浏览
    autoindex off;
}
